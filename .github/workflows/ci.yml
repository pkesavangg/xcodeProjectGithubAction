name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Show available simulators
        run: xcrun simctl list devices available
      
      - name: Install SwiftLint (if not using build tool plugin)
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi
        continue-on-error: true
      
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LintiTestingProject.xcodeproj
      
      - name: Build project
        run: |
          xcodebuild clean build \
            -project LintiTestingProject.xcodeproj \
            -scheme LintiTestingProject \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project LintiTestingProject.xcodeproj \
            -scheme LintiTestingProject \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:LintiTestingProjectTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Run UI Tests (Optional - can be slow)
        continue-on-error: false
        run: |
          xcodebuild test \
            -project LintiTestingProject.xcodeproj \
            -scheme LintiTestingProject \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:LintiTestingProjectUITests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Run SwiftLint
        run: |
          if command -v swiftlint &> /dev/null; then
            swiftlint lint --strict
          else
            echo "SwiftLint not found. Skipping lint check."
          fi
        continue-on-error: false

  lint-only:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi
      
      - name: Run SwiftLint
        run: swiftlint lint --strict
