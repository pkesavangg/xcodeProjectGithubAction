name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Show available simulators
        run: xcrun simctl list devices available
      
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LintiTestingProject.xcodeproj
      
      - name: Temporarily disable SwiftLint plugin for CI
        run: |
          cp LintiTestingProject.xcodeproj/project.pbxproj LintiTestingProject.xcodeproj/project.pbxproj.backup
          python3 << 'EOF'
          import re
          with open('LintiTestingProject.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          content = re.sub(r'\s+D0BFF8292F20CF55002D8455 /\* PBXTargetDependency \*/,?\n', '', content)
          content = re.sub(r'\s+productRef = D0BFF8282F20CF55002D8455 /\* SwiftLintBuildToolPlugin \*/,?\n', '', content)
          with open('LintiTestingProject.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          EOF
      
      - name: Build project
        run: |
          xcodebuild build \
            -project LintiTestingProject.xcodeproj \
            -scheme LintiTestingProject \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
      
      - name: Restore SwiftLint plugin
        if: always()
        run: |
          mv LintiTestingProject.xcodeproj/project.pbxproj.backup LintiTestingProject.xcodeproj/project.pbxproj || true

  unit-tests:
    runs-on: macos-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app
      
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LintiTestingProject.xcodeproj
      
      - name: Temporarily disable SwiftLint plugin for CI
        run: |
          cp LintiTestingProject.xcodeproj/project.pbxproj LintiTestingProject.xcodeproj/project.pbxproj.backup
          python3 << 'EOF'
          import re
          with open('LintiTestingProject.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          content = re.sub(r'\s+D0BFF8292F20CF55002D8455 /\* PBXTargetDependency \*/,?\n', '', content)
          content = re.sub(r'\s+productRef = D0BFF8282F20CF55002D8455 /\* SwiftLintBuildToolPlugin \*/,?\n', '', content)
          with open('LintiTestingProject.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          EOF
      
      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project LintiTestingProject.xcodeproj \
            -scheme LintiTestingProject \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:LintiTestingProjectTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
      
      - name: Restore SwiftLint plugin
        if: always()
        run: |
          mv LintiTestingProject.xcodeproj/project.pbxproj.backup LintiTestingProject.xcodeproj/project.pbxproj || true

  ui-tests:
    runs-on: macos-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app
      
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LintiTestingProject.xcodeproj
      
      - name: Temporarily disable SwiftLint plugin for CI
        run: |
          cp LintiTestingProject.xcodeproj/project.pbxproj LintiTestingProject.xcodeproj/project.pbxproj.backup
          python3 << 'EOF'
          import re
          with open('LintiTestingProject.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          content = re.sub(r'\s+D0BFF8292F20CF55002D8455 /\* PBXTargetDependency \*/,?\n', '', content)
          content = re.sub(r'\s+productRef = D0BFF8282F20CF55002D8455 /\* SwiftLintBuildToolPlugin \*/,?\n', '', content)
          with open('LintiTestingProject.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          EOF
      
      - name: Run UI Tests
        run: |
          xcodebuild test \
            -project LintiTestingProject.xcodeproj \
            -scheme LintiTestingProject \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:LintiTestingProjectUITests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
      
      - name: Restore SwiftLint plugin
        if: always()
        run: |
          mv LintiTestingProject.xcodeproj/project.pbxproj.backup LintiTestingProject.xcodeproj/project.pbxproj || true

  lint-only:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi
      
      - name: Run SwiftLint
        run: swiftlint lint --strict
