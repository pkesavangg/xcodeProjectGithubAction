name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Show available simulators
        run: xcrun simctl list devices available
      
      - name: Install SwiftLint (if not using build tool plugin)
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi
        continue-on-error: true
      
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LintiTestingProject.xcodeproj
      
      - name: Temporarily disable SwiftLint plugin for CI
        run: |
          # Backup project file
          cp LintiTestingProject.xcodeproj/project.pbxproj LintiTestingProject.xcodeproj/project.pbxproj.backup
          # Remove SwiftLint plugin dependency from dependencies array
          python3 << 'EOF'
          import re
          
          with open('LintiTestingProject.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          
          # Remove the dependency line from the dependencies array
          content = re.sub(r'\s+D0BFF8292F20CF55002D8455 /\* PBXTargetDependency \*/,?\n', '', content)
          
          # Remove the productRef line
          content = re.sub(r'\s+productRef = D0BFF8282F20CF55002D8455 /\* SwiftLintBuildToolPlugin \*/,?\n', '', content)
          
          with open('LintiTestingProject.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          EOF
      
      - name: Build project
        run: |
          xcodebuild build \
            -project LintiTestingProject.xcodeproj \
            -scheme LintiTestingProject \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
      
      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project LintiTestingProject.xcodeproj \
            -scheme LintiTestingProject \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:LintiTestingProjectTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
      
      - name: Run UI Tests (Optional - can be slow)
        continue-on-error: false
        run: |
          xcodebuild test \
            -project LintiTestingProject.xcodeproj \
            -scheme LintiTestingProject \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:LintiTestingProjectUITests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
      
      - name: Restore SwiftLint plugin
        if: always()
        run: |
          # Restore project file
          mv LintiTestingProject.xcodeproj/project.pbxproj.backup LintiTestingProject.xcodeproj/project.pbxproj || true
      
      - name: Run SwiftLint
        run: |
          if command -v swiftlint &> /dev/null; then
            swiftlint lint --strict
          else
            echo "SwiftLint not found. Skipping lint check."
          fi
        continue-on-error: false

  lint-only:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi
      
      - name: Run SwiftLint
        run: swiftlint lint --strict
