# ============================================
# Common Exclusions
# ============================================
excluded:
  - Pods
  - Carthage
  - DerivedData
  - .build
  - SourcePackages
  - LintiTestingProject.xcodeproj

# ============================================
# Common Disabled Rules
# ============================================
disabled_rules:
  - trailing_whitespace  # Often handled by formatters

# ============================================
# Common Opt-In Rules
# ============================================
opt_in_rules:
  - empty_count                    # Prefer isEmpty over count == 0
  - empty_string                   # Prefer isEmpty over == ""
  - force_unwrapping               # Warn about force unwraps
  - closure_spacing                # Spacing around closures
  - sorted_imports                 # Sort import statements
  - contains_over_filter_count     # Performance optimization
  - contains_over_filter_is_empty
  - first_where                    # Prefer first(where:) over filter.first
  - last_where                     # Prefer last(where:) over filter.last
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

# ============================================
# Force Operations - Set as Warnings
# ============================================
force_cast: warning
force_try: warning
force_unwrapping: warning

# ============================================
# Code Style Rules
# ============================================

# Line length
line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

# File length
file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

# Type body length (class/struct/enum)
type_body_length:
  warning: 300
  error: 400

# Function body length
function_body_length:
  warning: 50
  error: 100

# Function parameter count
function_parameter_count:
  warning: 5
  error: 8

# Cyclomatic complexity
cyclomatic_complexity:
  warning: 10
  error: 20

# Nesting depth
nesting:
  type_level: 2
  function_level: 3

# ============================================
# Naming Rules
# ============================================

# Type names (classes, structs, enums, protocols)
type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - URL
    - API
    - ID
    - OK
    - iOS
    - OS
    - UUID
    - TV
    - URLSession
    - URLRequest
    - URLResponse

# Identifier names (variables, functions)
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
    - URL
    - API
    - ok
    - no

# ============================================
# General Settings
# ============================================

# Don't fail if no lintable files found
allow_zero_lintable_files: false

# Treat all warnings as errors (useful for CI)
strict: false

# Reporter format
reporter: "xcode"

# Check for SwiftLint updates
check_for_updates: true
